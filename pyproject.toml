[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pit-adjuster"
version = "0.1.1"
description = "Point-in-time fixed-basis back-adjustment for daily prices, with corporate-action factor chains, convention-drift detection, and snapshot equivalence checks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["point-in-time", "back-adjustment", "hfq", "qfq", "corporate-actions", "quant", "pandas-free"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
padj = "pit_adjuster.cli:main"
pit-adjuster = "pit_adjuster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

